# OpenOCD configuration for the IEVISON / Lefanev LE-F30 control board
# Probe: ST-Link V2 (clone) on J9 (G / CLK / DIO) + the probe's RST pin on the
# flying lead soldered to the STM32-side pad of R57 (NRST is not on J9).
#
# The stock firmware re-purposes PA13/PA14 at boot, so the FIRST connection
# must be made with NRST asserted (connect_assert_srst). Our own firmware keeps
# SWD enabled, so this config keeps working afterwards.
#
# Usage (from the project root, OpenOCD = the one bundled with PlatformIO):
#   OCD=~/.platformio/packages/tool-openocd/bin/openocd
#   $OCD -f tools/openocd/station.cfg -c "init; reset halt; stm32f1x options_read 0; shutdown"
#   $OCD -f tools/openocd/station.cfg -c "init; reset halt; stm32f1x unlock 0; shutdown"   # IRREVERSIBLE
#   $OCD -f tools/openocd/station.cfg -c "program .pio/build/diag/firmware.elf verify reset exit"
# See README.md next to this file.

source [find interface/stlink.cfg]
transport select hla_swd
source [find target/stm32f1x.cfg]

# Hardware reset through the probe's RST pin, no gating (the F1 has no SWD gating
# issue), and connect with reset asserted. Many clones do not drive RST for
# STM32 targets: check with a meter that the R57 pad goes to 0 V during "init";
# if not, hold the NRST lead to GND by hand while the connection is made.
reset_config srst_only srst_nogate connect_assert_srst

# Slow and robust first; raise to 1000 once the link is proven.
adapter speed 100
