; Custom EVSE firmware - IEVISON / Lefanev LE-F30 charging station
; Target: STM32F103VET6 (Cortex-M3, 512 KB flash, 64 KB RAM, 12 MHz HSE)
; Build/flash: PlatformIO + STM32duino, upload via ST-Link (SWD on J9)
; The stock firmware is read-protected: the first flash needs RDP removed (an
; irreversible mass erase, see README and tools/openocd/README.md).

[env:evse]
platform = ststm32
board = genericSTM32F103VE          ; VET6 = V (100 pins) E (512 KB)
framework = arduino
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

build_flags =
    -D HSE_VALUE=12000000U          ; 12 MHz crystal on the board (not 8 MHz!)
    ; newlib-nano drops %f unless asked: without this the status line reads "OFFER= AMP="
    -D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
    ; longer ADC sampling for the high-impedance dividers (NTC, mains sense, CP)
    -D ADC_SAMPLINGTIME=ADC_SAMPLETIME_71CYCLES_5

; Display: 8-bit parallel panel on the FSMC, driven by src/display.cpp (no library).

[env:diag]
; Calibration / diagnostic build: streams raw ADC over UART (see src/main.cpp).
; Flash this first (with an EV) to measure the CP/CT/NTC thresholds, then set
; them in board.h and flash the normal [env:evse] build.
extends = env:evse
build_flags =
    ${env:evse.build_flags}
    -D DIAG_MODE

[env:ledprobe]
; The normal [env:evse] build plus the PINSCAN / PINWAVE / PINWS / PIN595 / PINPULL /
; PINOFF commands, to find which free pin drives an unknown part of the board (the
; LED bar was found this way). The LED bar driver is left out of this build.
extends = env:evse
build_flags =
    ${env:evse.build_flags}
    -D LED_PROBE
